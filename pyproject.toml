[project]
name = "conversation-tracker"
version = "0.1.0"
description = "A local semantic trajectory viewer for AMI meeting transcripts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "plotly>=6,<7",
    "scikit-learn>=1.6,<2",
    "sentence-transformers>=5,<6",
    "torch>=2.2,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
